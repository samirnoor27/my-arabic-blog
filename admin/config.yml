backend:
  name: git-gateway
  branch: main # أو master حسب اسم الفرع لديك

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "المقالات والبرامج"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان المقال / البرنامج", name: "title", widget: "string" }
      - { 
          label: "التصنيف", 
          name: "category", 
          widget: "select", 
          options: [
            { label: "مقالات", value: "articles" },
            { label: "أخبار", value: "news" },
            { label: "برامج وألعاب", value: "software" }
          ] 
        }
      - { label: "تاريخ النشر", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "صورة الغلاف", name: "image", widget: "image", required: false }
      - { label: "ملخص قصير", name: "summary", widget: "text" }
      - { label: "رابط التحميل (خاص بالبرامج)", name: "downloadUrl", widget: "string", required: false }
      - { label: "حجم الملف (مثال: 45 MB)", name: "size", widget: "string", required: false }
      - { label: "محتوى المقال الكامل", name: "body", widget: "markdown" }
